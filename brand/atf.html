<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Saint Haven ATF · One Message</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* Brand typefaces (guideline p.10): IvyPresto Display for headlines, GT America Extended for headings, labels and body */
@font-face{font-family:"SH IvyPresto Display";src:local("IvyPresto Display Light"),url(fonts/IvyPrestoDisplay-Regular.ttf) format("truetype");font-weight:100 900;font-display:swap}
@font-face{font-family:"SH GT America Extended";src:url(fonts/GT-America-Extended-Light.otf) format("opentype");font-weight:300;font-display:swap}
@font-face{font-family:"SH GT America Extended";src:url(fonts/GT-America-Extended-Regular.otf) format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"SH GT America Extended";src:url(fonts/GT-America-Extended-Medium.otf) format("opentype");font-weight:500 700;font-display:swap}
</style>
<style>
/* ============ Tokens (names mirror the Saint Haven Figma variables) ============ */
:root{
  --sh-neutral-0:#FFFFFF; --sh-neutral-50:#F5F5F5; --sh-neutral-100:#E6E6E6; --sh-neutral-200:#CCCCCC; --sh-neutral-300:#B3B3B3;
  --sh-neutral-400:#999999; --sh-neutral-600:#595959; --sh-neutral-800:#333333; --sh-neutral-900:#191919; --sh-neutral-950:#0D0D0D; --sh-neutral-1000:#000000;
  --sh-champagne-500:#B08A5B; --sh-champagne-600:#8C6B46;
  --surface-canvas:var(--sh-neutral-0); --text-primary:var(--sh-neutral-1000); --text-secondary:var(--sh-neutral-600); --text-muted:var(--sh-neutral-600);
  --border-subtle:var(--sh-neutral-100); --action-fill:var(--sh-neutral-1000); --action-hover:var(--sh-neutral-900); --action-label:var(--sh-neutral-0);
  --accent-line:var(--sh-champagne-600);
  --font-display:"SH IvyPresto Display",Georgia,serif;
  --font-body:"SH GT America Extended",system-ui,sans-serif;
  --radius-field:5px; --size-button-height:56px; --button-width:496px;
  --tracking-caps:.12em;
  --motion-ease-reveal:cubic-bezier(.65,0,.35,1); --motion-ease-out:cubic-bezier(.22,1,.36,1);
  --motion-duration-fast:200ms; --motion-duration-line:900ms; --motion-stagger:120ms;
}
.theme-dark{
  --surface-canvas:var(--sh-neutral-950); --text-primary:var(--sh-neutral-0); --text-secondary:var(--sh-neutral-300); --text-muted:var(--sh-neutral-400);
  --border-subtle:#262626; --action-fill:var(--sh-neutral-0); --action-hover:var(--sh-neutral-100); --action-label:var(--sh-neutral-1000);
  --accent-line:var(--sh-champagne-500);
}

/* ============ Presentation chrome ============ */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);font-weight:300;color:#000;background:#fff;-webkit-font-smoothing:antialiased}
img,video{display:block}
a{color:inherit}
.wrap{max-width:1480px;margin:0 auto;padding:0 32px}
.bar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);border-bottom:1px solid #e6e6e6}
.bar .wrap{display:flex;align-items:center;gap:28px;height:60px}
.bar .lg{width:120px;height:22px;background:url(img/logo.svg) left center/contain no-repeat;flex:none}
.bar nav{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;font-size:14px;font-weight:400}
.bar nav a{text-decoration:none;color:#595959;white-space:nowrap}
.bar nav a:hover{color:#000}
.intro{padding:72px 0 48px;border-bottom:1px solid #e6e6e6}
.intro .k{font-size:14px;color:#595959;margin-bottom:18px}
.intro h1{font-family:var(--font-display);font-weight:400;font-size:clamp(44px,5.6vw,72px);line-height:1;letter-spacing:-.01em}
.intro p.lede{font-size:18px;line-height:1.55;max-width:66ch;margin-top:20px;color:#333}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:36px}
.rules div{border:1px solid #e6e6e6;padding:20px}
.rules h4{font-size:14px;font-weight:500;margin-bottom:6px}
.rules p,.rules li{font-size:14px;line-height:1.55;color:#333}
.rules ul{padding-left:18px}
.opt{padding:72px 0 64px;border-bottom:1px solid #e6e6e6}
.opt-head{display:grid;grid-template-columns:1fr 1.1fr;gap:48px;align-items:end;margin-bottom:28px}
.opt-head .n{font-size:14px;color:#595959;margin-bottom:8px}
.opt-head h2{font-family:var(--font-display);font-weight:400;font-size:clamp(36px,4.4vw,56px);line-height:1}
.opt-head p{font-size:17px;line-height:1.55;color:#333}
.boards{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
.board-col .cap{font-size:13px;color:#595959;margin-top:10px}
.frame{position:relative;overflow:hidden;background:#111;border:1px solid #e6e6e6}
.artboard{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;container-type:inline-size;container-name:ab}
.artboard.d{width:1440px;height:810px}
.artboard.m{width:390px;height:844px}
.controls{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;margin-top:18px;font-size:13px;color:#595959}
.controls .grp{display:flex;gap:4px;align-items:center}
.controls .grp span{margin-right:6px}
.controls button{font:inherit;font-weight:400;font-size:13px;background:none;border:1px solid #ccc;color:#333;padding:5px 10px;cursor:pointer}
.controls button.on{border-color:#000;background:#000;color:#fff}
.controls .replay{margin-left:auto;border-color:#000;color:#000}
.controls .replay:hover{background:#000;color:#fff}
.note{margin-top:20px;font-size:14px;line-height:1.55;color:#333;max-width:90ch}
.note b{font-weight:500}
.foot{padding:72px 0 120px}
.foot h2{font-family:var(--font-display);font-weight:400;font-size:clamp(34px,4vw,52px);line-height:1;margin-bottom:24px}
.foot .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.foot .card{border:1px solid #e6e6e6;padding:24px}
.foot .card.rec{border-color:#000}
.foot .card h4{font-size:15px;font-weight:500;margin-bottom:8px}
.foot .card p,.foot .card li{font-size:15px;line-height:1.55;color:#333}
.foot .card ul{padding-left:18px}
.foot .card li+li{margin-top:6px}
@media (max-width:1000px){.boards{grid-template-columns:1fr}.boards .board-col.mob{max-width:320px}.opt-head{grid-template-columns:1fr;gap:12px}.rules,.foot .grid{grid-template-columns:1fr}}
@media (max-width:560px){.wrap{padding:0 16px}}

/* ============ The hero (SH/Hero · One Message) ============ */
.sh-hero{position:absolute;inset:0;background:var(--surface-canvas);color:var(--text-primary);overflow:hidden}
.sh-nav{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border-subtle);z-index:5;background:var(--surface-canvas)}
.sh-logo{width:172px;height:32px;background:url(img/logo.svg) center/contain no-repeat}
.theme-dark .sh-logo{filter:invert(1)}
.stack{position:absolute;left:0;right:0;top:64px;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 160px 40px;z-index:3}
.sh-h{font-family:var(--font-display);font-weight:400;text-transform:uppercase;letter-spacing:.005em;line-height:1.02;color:var(--text-primary);background:var(--surface-canvas);padding:0 .25em}
.sh-h.s{font-size:76px} .sh-h.mid{font-size:58px} .sh-h.l{font-size:50px}
.sh-h.sentence{text-transform:none;letter-spacing:-.01em}
.ln{display:block;overflow:hidden;padding-bottom:.05em}
.ln>span{display:block;transform:translateY(105%)}
.play .ln>span{animation:lineUp var(--motion-duration-line) var(--motion-ease-out) both;animation-delay:calc(350ms + var(--l,0) * 90ms)}
@keyframes lineUp{to{transform:none}}
.sh-sub{margin-top:26px;font-family:var(--font-body);font-weight:400;font-size:15px;line-height:1.65;letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-secondary);max-width:760px;text-wrap:balance;background:var(--surface-canvas);padding:0 .6em}
.sh-cta{margin-top:44px;display:flex;flex-direction:column;align-items:center;background:var(--surface-canvas);padding:0 8px}
.sh-button{display:flex;align-items:center;justify-content:center;width:var(--button-width);height:var(--size-button-height);border-radius:var(--radius-field);background:var(--action-fill);color:var(--action-label);font-family:var(--font-body);font-weight:400;font-size:14px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background-color var(--motion-duration-fast) var(--motion-ease-out),transform 160ms var(--motion-ease-out)}
.sh-button:hover{background:var(--action-hover)}
.sh-button:active{transform:scale(.98)}
.sh-micro{margin-top:14px;font-family:var(--font-body);font-weight:300;font-size:10px;line-height:1.6;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.sh-micro a{color:inherit;text-decoration:none;font-weight:inherit}
.sh-featured{position:absolute;left:0;right:0;bottom:30px;text-align:center;z-index:3;font-family:var(--font-body);font-weight:400;font-size:11px;letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
.sh-featured span{background:var(--surface-canvas);padding:4px 14px}

/* focus-in for sub, CTA, micro, featured */
.rv{opacity:0;transform:translateY(8px);filter:blur(3px)}
.play .rv{animation:focusIn 900ms var(--motion-ease-out) both;animation-delay:calc(800ms + var(--d,0) * var(--motion-stagger))}
@keyframes focusIn{to{opacity:1;transform:none;filter:blur(0)}}

/* Variant: front door (photo) */
.v-photo .sh-nav{background:var(--sh-neutral-0);border-bottom:0}
.v-photo .sh-logo{filter:none}
.v-photo .film{position:absolute;left:0;right:0;top:64px;bottom:0;overflow:hidden;z-index:1}
.v-photo .film video{width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.v-photo .film::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,9,8,.5) 0%,rgba(10,9,8,.42) 45%,rgba(10,9,8,.55) 100%)}
.play.v-photo .film video{animation:settle 6s var(--motion-ease-out) both}
@keyframes settle{from{transform:scale(1.05)}to{transform:scale(1)}}
.v-photo .stack{justify-content:flex-start;padding-top:236px}
.v-photo .sh-h,.v-photo .sh-sub,.v-photo .sh-cta,.v-photo .sh-featured span{background:none}
.v-photo .sh-h.s{font-size:60px} .v-photo .sh-h.mid{font-size:48px} .v-photo .sh-h.l{font-size:42px}
.v-photo .sh-sub{color:rgba(255,255,255,.88);margin-top:18px;font-size:14px}
.v-photo .sh-cta{margin-top:40px}
.v-photo .sh-button{width:300px;border-radius:0}
.v-photo .sh-micro{color:rgba(255,255,255,.8)}
.v-photo .sh-featured{color:rgba(255,255,255,.75)}

@container ab (max-width:500px){
  .sh-nav{height:56px}
  .sh-logo{width:140px;height:26px}
  .stack{top:56px;padding:0 28px 48px}
  .sh-h.s{font-size:46px} .sh-h.mid{font-size:30px} .sh-h.l{font-size:27px}
  .sh-sub{font-size:13px;margin-top:20px;line-height:1.6}
  .sh-cta{margin-top:32px;width:100%}
  .sh-button{width:100%;max-width:300px}
  .sh-micro{font-size:9px;line-height:1.6;text-wrap:balance;margin-top:12px}
  .sh-sub{text-wrap:balance}
  .sh-featured{bottom:22px;padding:0 32px;line-height:1.8;font-size:10px}
  .v-photo .film{top:56px}
  .v-photo .film video{object-position:50% 50%}
  .v-photo .stack{padding-top:226px}
  .v-photo .sh-h.s{font-size:42px} .v-photo .sh-h.mid{font-size:30px} .v-photo .sh-h.l{font-size:27px}
  .v-photo .sh-sub{font-size:12px}
  .v-photo .sh-button{width:100%;max-width:300px}
}


/* ============ Variant 4 · Portal (scroll-driven zoom through an arch) ============ */
.v-portal .layer{position:absolute;left:0;right:0;top:0;bottom:0;will-change:clip-path}
.v-portal .room{z-index:1;overflow:hidden}
.v-portal .room img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform,filter}
.v-portal .room::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,9,8,.35),rgba(10,9,8,0) 30%,rgba(10,9,8,0) 55%,rgba(10,9,8,.7));opacity:var(--endshade,0)}
.v-portal .rim{z-index:1;background:radial-gradient(ellipse at 50% 80%,#2a221a,#14110e 70%)}
.v-portal .stack{top:0;justify-content:center;padding:0 160px;will-change:opacity,transform}
.v-portal .sh-h.s{font-size:68px} .v-portal .sh-h.mid{font-size:50px} .v-portal .sh-h.l{font-size:44px}
.v-portal .sh-cta{margin-top:36px}
.v-portal .sh-nav{z-index:6}
.v-portal .sh-featured{z-index:4}
.v-portal .end{position:absolute;left:0;right:0;bottom:64px;z-index:4;display:flex;flex-direction:column;align-items:center;opacity:0;pointer-events:none}
.v-portal .end .sh-button{width:300px;border-radius:0}
.v-portal .end .sh-micro{color:rgba(255,255,255,.8)}
.v-portal .end .sh-micro a{color:inherit}
.v-portal .hint{position:absolute;left:0;right:0;z-index:4;text-align:center;font-family:var(--font-body);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55);pointer-events:none}
.v-portal .scroller{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;z-index:7}
.v-portal .scroller::-webkit-scrollbar{display:none}
.v-portal .track{height:360%}
.v-portal.scrolled .scroller{pointer-events:auto}
@container ab (max-width:500px){
  .v-portal .stack{padding:0 28px}
  .v-portal .sh-h.s{font-size:42px} .v-portal .sh-h.mid{font-size:30px} .v-portal .sh-h.l{font-size:27px}
  .v-portal .end{bottom:48px;padding:0 28px}
  .v-portal .end .sh-button{width:100%;max-width:300px}
}

/* ============ Portal heroes: Our belief arrives over the room ============ */
.inshade{position:absolute;inset:0;z-index:4;background:radial-gradient(ellipse at center,rgba(8,7,6,.5),rgba(8,7,6,.78));opacity:0;pointer-events:none}
.inside{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:64px 160px 0;pointer-events:none}
.inside-in{max-width:760px;display:flex;flex-direction:column;align-items:center;text-align:center}
.inside .fx{opacity:0;will-change:opacity,transform}
.inside .sec-eye{color:rgba(255,255,255,.72)}
.inside .sec-h{color:#fff}
.inside .sec-body p{color:rgba(255,255,255,.84)}
.inside .sec-body .sec-strong{color:#fff}
@container ab (max-width:500px){ .inside{padding:56px 28px 0} }

/* ============ Variant 5 · Front Door Portal ============ */
.v-doorportal .film{will-change:transform;overflow:visible}
.v-doorportal .film::after{opacity:var(--wash,1)}
.play.v-doorportal .film video{animation:none}
.v-doorportal .dp{position:absolute;left:0;right:0;top:64px;bottom:0;overflow:hidden;will-change:clip-path,opacity;opacity:0}
.v-doorportal .dp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.v-doorportal .black{z-index:2;background:#050404}
.v-doorportal .room{z-index:3;opacity:1;clip-path:inset(50% 50% 50% 50%)}
.v-doorportal .film{transform-origin:0 0}
.v-doorportal .film .base,.v-doorportal .film .leaf{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.v-doorportal .pc{position:absolute;z-index:1;transform:translate(-50%,-50%);white-space:nowrap;font-family:var(--font-body);font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:#241c14;text-shadow:0 0 3px rgba(255,226,180,.55),0 0 10px rgba(255,214,160,.35)}
.v-doorportal .hole{position:absolute;z-index:1;overflow:hidden;background:#030202;opacity:0}
.v-doorportal .inroom{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform,filter}
.v-doorportal .leafwrap{position:absolute;inset:0;z-index:1;pointer-events:none}
.v-doorportal .leaf{position:absolute;left:0;top:0;will-change:transform;opacity:0}
.v-doorportal .leafshade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.v-doorportal .room::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,9,8,0) 50%,rgba(10,9,8,.7));opacity:var(--endshade,0)}
.v-doorportal .stack{z-index:4}
.v-doorportal .sh-featured{z-index:4}
.v-doorportal .end{position:absolute;left:0;right:0;bottom:64px;z-index:5;display:flex;flex-direction:column;align-items:center;opacity:0;pointer-events:none}
.v-doorportal .end .sh-button{width:300px;border-radius:0}
.v-doorportal .end .sh-micro{color:rgba(255,255,255,.85)}
.v-doorportal .end .sh-micro a{color:inherit}
.v-doorportal .hint{position:absolute;left:0;right:0;z-index:5;text-align:center;font-family:var(--font-body);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.6);pointer-events:none}
.v-doorportal .scroller{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;z-index:7}
.v-doorportal .scroller::-webkit-scrollbar{display:none}
.v-doorportal .track{height:640%}
@container ab (max-width:500px){
  .v-doorportal .dp{top:56px}
  .v-doorportal .end{bottom:48px;padding:0 28px}
  .v-doorportal .end .sh-button{width:100%;max-width:300px}
}

.sh-hero .sh-h,.sh-hero .sh-sub,.sh-hero .sh-cta{background:none}
/* ============ SH/Hero · In their words band ============ */
.sh-hero{--band:0px}
/* ===== Press under the headline complex ===== */
.hp{--hp-fg:rgba(255,255,255,.72);--hp-logo:.62}
.sh-hero:not(.theme-dark) .hp{--hp-fg:rgba(0,0,0,.6);--hp-logo:.55}
.hp-logo{height:calc(var(--h) * .72);width:auto;display:block;opacity:var(--hp-logo)}
.sh-hero:not(.theme-dark) .hp-logo{filter:invert(1)}
.hp-q{font-family:var(--font-body);font-weight:300;font-size:14px;line-height:1.55;color:var(--hp-fg);text-wrap:balance}
/* row: three equal columns under the CTA */
.hp-row{margin-top:64px;display:grid;grid-template-columns:repeat(3,236px);column-gap:72px;justify-content:center}
.hp-item{display:flex;flex-direction:column;align-items:center;text-align:center;margin:0}
.hp-item .hp-logo{height:calc(var(--h) * .72)}
.hp-item>img{min-height:0}
.hp-item .hp-q{margin-top:16px;max-width:24ch}
.hp-row .hp-item,.hp-band .hp-item{justify-content:flex-start}
.hp-row .hp-item>img,.hp-band .hp-item>img{height:calc(var(--h) * .72);margin-top:calc((40px - var(--h)) * .36)}
/* Press row: the row keeps its layout box (110px desktop, 244px mobile) so the headline complex never moves;
   inside it the logos are ~35% larger and sit 32px lower (the 64px gap becomes 96px) */
.hp-row{height:110px;align-items:start}
.hp-row .hp-item{transform:translateY(52px)}
.hp-lbox{height:40px;display:flex;align-items:flex-end;justify-content:center}
.hp-row .hp-lbox .hp-logo{height:calc(var(--h) * .97 * var(--b,1));margin:0}
.hp-row .hp-q{margin-top:20px}
/* band: anchored to the foot of the hero, the stack re-centres above it */
.sh-hero:has(.hp-band){--band:208px}
.hp-band{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:0 0 72px}
.hp-track{display:grid;grid-template-columns:repeat(3,236px);column-gap:96px;justify-content:center}
/* spotlight: logos as a quiet index, one quote at a time */
.hp-spot{margin-top:60px;display:flex;flex-direction:column;align-items:center}
.hp-logos{display:flex;align-items:center;gap:48px}
.hp-tab{appearance:none;background:none;border:0;padding:10px 6px;cursor:pointer;display:flex;align-items:center;height:48px}
.hp-tab .hp-logo{opacity:.3;transition:opacity .4s var(--motion-ease-out)}
.hp-tab.on .hp-logo{opacity:.9}
.hp-tab:active .hp-logo{transform:scale(.97)}
.hp-quotes{position:relative;margin-top:18px;width:560px;height:48px}
.hp-spot .hp-q{position:absolute;left:0;right:0;top:0;margin:0;text-align:center;font-size:15px;opacity:0;transform:translateY(6px);transition:opacity .5s var(--motion-ease-out),transform .5s var(--motion-ease-out)}
.hp-spot .hp-q.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){ .hp-spot .hp-q{transform:none;transition:opacity .2s linear} }
@container ab (max-width:500px){
  .hp-row{margin-top:40px;grid-template-columns:1fr;row-gap:26px}
  .hp-row{height:244px}
  .hp-row .hp-item{transform:translateY(8px)}
  .hp-lbox{height:30px}
  .hp-row .hp-lbox .hp-logo{height:calc(var(--h) * .75 * var(--b,1))}
  .hp-row .hp-item>img{height:calc(var(--h) * .56);margin-top:0}
  .hp-row .hp-q{margin-top:10px;font-size:13px}

function initClub(sec,page,mobile){
  const H=mobile?844:810;
  const  scenes=[...sec.querySelectorAll('.scene')], idx=sec.querySelector('.club-index'), tabs=[...idx.children];
  const clamp=x=>Math.max(0,Math.min(1,x)), seg=(x,a,b)=>clamp((x-a)/(b-a)), out=t=>1-Math.pow(1-t,3);
  const A=0, W=(1-.1)/4, reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function render(){
    const q=clamp((page.scrollTop-sec.offsetTop)/(sec.offsetHeight-H));
    let active=-1;
    scenes.forEach((sc,i)=>{
      const a=A+i*W, img=sc.firstElementChild.firstElementChild, copy=sc.lastElementChild;
      const vin=i===0?1:seg(q,a-.04,a+.04);
      sc.style.opacity=vin.toFixed(3);
      if(!reduce) img.style.transform=`scale(${(1.06-.06*out(seg(q,a-.03,a+W*.8))).toFixed(4)})`;
      const cin=i===0?1:seg(q,a+.03,a+.08), cout=i<3?seg(q,a+W-.05,a+W-.01):0;
      copy.style.opacity=(cin*(1-cout)).toFixed(3);
      copy.style.transform=`translateY(${(16*(1-cin)-8*cout).toFixed(1)}px)`;
      if(q>=a-.005) active=i;
    });
    idx.style.opacity=(1-seg(q,.88,.93)).toFixed(3);
    tabs.forEach((t,i)=>t.classList.toggle('on',i===active));
  }
  page.addEventListener('scroll',()=>requestAnimationFrame(render),{passive:true});
  render();
}

// every photo outside the pinned scenes settles from 106% to 100% as it crosses the screen
function settle(page){
  const imgs=[...page.querySelectorAll('.sec-media img, .sec-bg img, .sec-bg video, .split-media:not([data-fx]) img')];
  // Personalised care: the photo is first seen through an arch, which opens to the full frame as it reaches the middle of the screen
  // By application: one slow camera push down the corridor while the section is on screen
  const arch=page.querySelector('.arch-open'), dolly=page.querySelector('.dolly');
  const yOf=el=>{let y=0,n=el;while(n&&n!==page){y+=n.offsetTop;n=n.offsetParent;}return y;};
  const ease=t=>1-Math.pow(1-t,3), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ imgs.forEach(im=>im.style.transform='none'); if(dolly) dolly.firstElementChild.style.transform='none'; if(arch) arch.firstElementChild.style.transform='none'; return; }
  const fx=()=>{ const H=page.clientHeight, top=page.scrollTop;
    if(arch){ const im=arch.firstElementChild, w=arch.offsetWidth, h=arch.offsetHeight, y=yOf(arch);
      const t=ease(Math.max(0,Math.min(1,(top+H-y-h*.1)/(H*.62))));
      const aw=Math.min(w*.42,h*.5)+(w-Math.min(w*.42,h*.5))*t, side=(w-aw)/2, topIn=h*.12*(1-t), r=(aw/2)*(1-t);
      im.style.clipPath=`inset(${topIn.toFixed(1)}px ${side.toFixed(1)}px 0px ${side.toFixed(1)}px round ${r.toFixed(1)}px ${r.toFixed(1)}px 0 0)`;
      im.style.transform=`scale(${(1.14-.14*t).toFixed(4)})`; }
    if(dolly){ const im=dolly.firstElementChild, h=dolly.offsetHeight, y=yOf(dolly);
      const t=Math.max(0,Math.min(1,(top+H-y)/(H+h)));
      im.style.transform=`scale(${(1+.22*t*t).toFixed(4)})`; im.style.transformOrigin='50% 52%'; } };
  page.addEventListener('scroll',()=>requestAnimationFrame(fx),{passive:true}); fx();
  const run=()=>{ const H=page.clientHeight, top=page.scrollTop;
    imgs.forEach(im=>{ const box=im.parentElement; let y=0,n=box; while(n&&n!==page){y+=n.offsetTop;n=n.offsetParent;}
      const t=Math.max(0,Math.min(1,(top+H-y)/(H+box.offsetHeight))); im.style.transform=`scale(${(1.06-.06*t).toFixed(4)})`; }); };
  page.addEventListener('scroll',()=>requestAnimationFrame(run),{passive:true}); run();
}

     ${v.cls==='v-portal'?`<div class="grp" data-k="img"><span>Room</span><button data-v="0">South Yarra Portal</button><button data-v="1">North Sydney Bathhouse</button><button data-v="2">South Yarra Haven</button><button data-v="3">South Melbourne Arrival</button></div>`:''}
     <button class="playpage">Play the page</button>
     <button class="replay">Back to top</button>
   </div></div>`;
  root.appendChild(sec);
  const state={...v.def};
  const boards=[...sec.querySelectorAll('.artboard.d, .artboard.m')];
  function draw(play){
    boards.forEach((b,i)=>{
      const mobile=i===1; b.innerHTML=pageHTML(v,state,mobile);
      const page=b.firstElementChild, hero=page.querySelector('.sh-hero'), D=+page.dataset.d;
      hero.classList.toggle('play',!!play);
      if(v.cls==='v-portal') initPortal(hero,mobile,page,+page.dataset.d1,D);
      if((v.cls||'').includes('v-doorportal')) initDoorPortal(hero,mobile,page,+page.dataset.d1,D);
      if(v.press==='spot') initSpot(hero);
      const sio=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); }),{root:page,threshold:.25});
      initClub(page.querySelector('.club'),page,mobile);
      initConc(page.querySelector('.conc'),page,mobile);
      page.querySelectorAll('.reveal').forEach(el=>sio.observe(el));
      settle(page);
      premium(b,page,v,mobile);
    });
    sec.querySelectorAll('.grp').forEach(g=>g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===state[g.dataset.k])));
    sec.querySelectorAll('video').forEach(x=>vio.observe(x));
  }
  sec._replay=()=>boards.forEach(b=>{const page=b.firstElementChild; page.scrollTop=0; const h=page.querySelector('.sh-hero'); h.classList.remove('play'); void h.offsetWidth; h.classList.add('play');});
  sec.querySelectorAll('.grp').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button'); if(!b)return; state[g.dataset.k]=+b.dataset.v; draw(true);}));
  sec.querySelector('.replay').addEventListener('click',sec._replay);
  sec.querySelector('.playpage').addEventListener('click',()=>boards.forEach(b=>{
    const page=b.firstElementChild, max=page.scrollHeight-page.clientHeight, D=Math.max(9000,max*2.4), t0=performance.now(); page.scrollTop=0;
    const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    const f=n=>{const t=Math.min(1,(n-t0)/D); page.scrollTop=max*ease(t); if(t<1) requestAnimationFrame(f);}; requestAnimationFrame(f);
  }));
  draw(false);
});

// ===== Portal heroes: once inside, the room dims and Our belief rises line by line, still pinned =====
function beliefFX(hero){
  const shade=hero.querySelector('.inshade'), fx=[...hero.querySelectorAll('.inside .fx')];
  const clamp=x=>Math.max(0,Math.min(1,x)), seg=(x,a,b)=>clamp((x-a)/(b-a)), out=t=>1-Math.pow(1-t,3);
  return q=>{ shade.style.opacity=out(seg(q,0,.3)).toFixed(3);
    fx.forEach((el,i)=>{ const t=out(seg(q,.06+i*.06,.3+i*.06)); el.style.opacity=t.toFixed(3); el.style.transform=`translateY(${(18*(1-t)).toFixed(1)}px)`; }); };
}
// one smoothed scroll value drives both phases: p = the camera move, q = the belief reveal
function pinDriver(page,D1,D,render){
  let ty=0,y=0,run=false; const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches, D2=D-D1;
  const go=()=>render(Math.max(0,Math.min(1,y/D1)),Math.max(0,Math.min(1,(y-D1)/D2)));
  function tick(){ y+=(ty-y)*.09; if(Math.abs(ty-y)<.5)y=ty; go(); if(y!==ty)requestAnimationFrame(tick); else run=false; }
  page.addEventListener('scroll',()=>{ ty=Math.min(D,page.scrollTop); if(reduce){y=ty;go();return;} if(!run){run=true;requestAnimationFrame(tick);} },{passive:true});
  go();
}

// ===== Portal: scroll-driven zoom through the arch =====
function initPortal(hero,mobile,page,D1,D){
  const W=mobile?390:1440, H=mobile?844:810;
  const room=hero.querySelector('.room'), img=room.querySelector('img'), rim=hero.querySelector('.rim'), stack=hero.querySelector('.stack');
  const w0=mobile?150:200, h0=Math.round(w0/0.57), cx=W/2, cy=H/2+h0*.08;
  const clamp=x=>Math.max(0,Math.min(1,x)), seg=(x,a,b)=>clamp((x-a)/(b-a)), out=t=>1-Math.pow(1-t,3), sine=t=>-(Math.cos(Math.PI*t)-1)/2;
  const SMAX=mobile?18:14;
  function arch(scale){ const w=w0*scale,h=h0*scale; const L=cx-w/2, T=cy-h/2, r=w/2;
    return `inset(${T.toFixed(1)}px ${(W-L-w).toFixed(1)}px ${(H-T-h).toFixed(1)}px ${L.toFixed(1)}px round ${r.toFixed(1)}px ${r.toFixed(1)}px 0 0)`; }
  const bel=beliefFX(hero);
  function render(p,q){
    // one unbroken push: the arch is born as a point and the camera walks straight through it, no hold between
    const u=sine(seg(p,.03,.95)), sc1=SMAX*Math.pow(u,2.4);
    room.style.clipPath=arch(sc1);
    rim.style.clipPath=arch(sc1*1.07+0.06*Math.min(1,sc1));
    img.style.transformOrigin=`${cx}px ${cy}px`;
    img.style.transform=`scale(${(1.6-0.6*out(seg(p,.03,1))-0.04*q).toFixed(4)})`;
    img.style.filter=`brightness(${(0.72+0.28*seg(p,.2,.8)).toFixed(3)})`;
    room.style.setProperty('--endshade',seg(p,.75,1).toFixed(3));
    const fo=1-seg(p,.01,.14);
    stack.style.opacity=fo.toFixed(3); stack.style.transform=`translateY(${(-30*(1-fo)).toFixed(1)}px)`; stack.style.pointerEvents=fo>.5?'auto':'none';
    bel(q);
  }
  pinDriver(page,D1,D,render);
}



// ===== Front Door Portal: one continuous dolly; the double doors part from the centre seam and swing inward as the camera passes through =====
function initDoorPortal(hero,mobile,page,PD1,D){
  const W=mobile?390:1440, H=mobile?844:810, HD=mobile?56:64, LW=W, LH=H-HD, DPR=1.5;
  const film=hero.querySelector('.film'), base=film.querySelector('.base'), wrap=film.querySelector('.leafwrap');
  const leafL=film.querySelector('.leaf.l'), leafR=film.querySelector('.leaf.r'), hole=film.querySelector('.hole'), inroom=hole.querySelector('img');
  const stack=hero.querySelector('.stack'), band=hero.querySelector('.sh-band'), bel=beliefFX(hero);
  const clamp=x=>Math.max(0,Math.min(1,x)), seg=(x,a,b)=>clamp((x-a)/(b-a)), lerp=(a,b,t)=>a+(b-a)*t;
  const inout=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, out=t=>1-Math.pow(1-t,3), sine=t=>-(Math.cos(Math.PI*t)-1)/2;
  const k=Math.max(LW/1280,LH/716), dw=1280*k, dh=716*k, ox=(LW-dw)/2, oy=(LH-dh)/2;
  const P=(x,y)=>({x:ox+x*dw,y:oy+y*dh});
  // doorway inside the frame, below the transom: x .426-.5725, y .438-.794; the pair splits at the centre seam
  const D0=P(.426,.438), D1=P(.5725,.794), SEAM=(D0.x+D1.x)/2;
  hole.style.cssText+=`left:${D0.x}px;top:${D0.y}px;width:${D1.x-D0.x}px;height:${D1.y-D0.y}px`;
  [leafL,leafR].forEach(c=>{c.width=Math.round(LW*DPR);c.height=Math.round(LH*DPR);c.style.width=LW+'px';c.style.height=LH+'px';});
  const ins=(l,r)=>`inset(${D0.y.toFixed(1)}px ${(LW-r).toFixed(1)}px ${(LH-D1.y).toFixed(1)}px ${l.toFixed(1)}px)`;
  leafL.style.clipPath=ins(D0.x,SEAM); leafL.style.transformOrigin=`${D0.x}px ${(D0.y+D1.y)/2}px`;
  leafR.style.clipPath=ins(SEAM,D1.x); leafR.style.transformOrigin=`${D1.x}px ${(D0.y+D1.y)/2}px`;
  wrap.style.perspective=`${((D1.y-D0.y)*2.4).toFixed(0)}px`;
  wrap.style.perspectiveOrigin=`${SEAM}px ${(D0.y+D1.y)/2}px`;
  const C={x:LW/2,y:LH/2}, F1=P(.5,.508), HOLE={x:SEAM,y:(D0.y+D1.y)/2};
  const sEnd=Math.max(LW/(D1.x-D0.x),LH/(D1.y-D0.y))*1.35;
  function cam(f,s){film.style.transform=`translate(${(C.x-f.x*s).toFixed(2)}px,${(C.y-f.y*s).toFixed(2)}px) scale(${s.toFixed(4)})`;}
  // the room is sized so it exactly fills the screen when the camera arrives, so the whole room is seen, not a crop of it
  { const rw=LW/sEnd*1.04, rh=LH/sEnd*1.04; inroom.style.cssText+=`inset:auto;left:${(HOLE.x-D0.x-rw/2).toFixed(2)}px;top:${(HOLE.y-D0.y-rh/2).toFixed(2)}px;width:${rw.toFixed(2)}px;height:${rh.toFixed(2)}px`; }
  // freeze the film and paint the exact frame onto both door leaves, so the doors are the real door
  let held=false;
  function snapshot(){ [leafL,leafR].forEach(c=>{const g=c.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0); g.drawImage(base,ox,oy,dw,dh);}); }
  function hold(on){ if(on===held) return; held=on; hero._held=on;
    if(on){ base.pause(); snapshot(); leafL.style.opacity=leafR.style.opacity=1; hole.style.opacity=1; }
    else { leafL.style.opacity=leafR.style.opacity=0; hole.style.opacity=0; base.play().catch(()=>{}); } }
  function render(p,q){
    hold(p>.004);
    // the copy and the press band lift away, the evening wash clears
    const fo=1-seg(p,.01,.12);
    stack.style.opacity=fo.toFixed(3); stack.style.transform=`translateY(${(-30*(1-fo)).toFixed(1)}px)`;
    if(band) band.firstElementChild.style.opacity=fo.toFixed(3); stack.style.pointerEvents=fo>.5?'auto':'none';
    film.style.setProperty('--wash',(1-seg(p,.03,.3)).toFixed(3));
    // one continuous dolly: slow to start, gathering pace through the doorway, easing out inside
    const t=inout(seg(p,.02,.96));
    const s=Math.exp(Math.log(sEnd)*t);
    const aim=sine(seg(p,.02,.34)), into=sine(seg(p,.34,.8));
    const f={x:lerp(lerp(C.x,F1.x,aim),HOLE.x,into),y:lerp(lerp(C.y,F1.y,aim),HOLE.y,into)};
    cam(f,s);
    // the pair parts at the seam and swings inward on outer hinges while the camera keeps moving
    const o=inout(seg(p,.3,.74));
    leafL.style.transform=`rotateY(${(84*o).toFixed(2)}deg)`;
    leafR.style.transform=`rotateY(${(-84*o).toFixed(2)}deg)`;
    const shade=(1-.62*o).toFixed(3); leafL.style.filter=leafR.style.filter=`brightness(${shade})`;
    // inside is dark at first, then the room comes up out of the darkness
    const lit=sine(seg(p,.5,.93));
    inroom.style.filter=`brightness(${(.05+.95*lit).toFixed(3)})`;
    inroom.style.transform=`scale(${(1.3-.3*out(seg(p,.3,1))).toFixed(4)})`;
    bel(q);
  }
  pinDriver(page,PD1,D,render);
}

// ===== Premium details, wired per artboard =====
const APPLY_URL=location.hostname.endsWith('github.io')?'../index.html':'https://chelseakingkong.github.io/saint-haven-staging/';
function premium(board,page,v,mobile){

  // Black and White: the first club photo fades in and sharpens as it rises into view (reverses on the way back)
  const first=page.classList.contains('lfx') && page.querySelector('.club .scene[data-i="0"] .scene-media');
  if(first){ const club=first.closest('.club'), Hh=page.clientHeight, reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const run=()=>{ const y=club.offsetTop-page.scrollTop; const t=Math.max(0,Math.min(1,(y-Hh*.15)/(Hh*.75))); const e=t*t*(3-2*t);
      first.style.opacity=(1-e).toFixed(3); first.style.filter=reduce?'none':`blur(${(e*10).toFixed(2)}px)`; };
    page.addEventListener('scroll',()=>requestAnimationFrame(run),{passive:true}); run(); }
  // 2. blurred previews
  page.querySelectorAll('img').forEach(im=>{
    const f=(im.getAttribute('src')||'').split('/').pop(); const lq=window.LQIP&&LQIP[f]; if(!lq) return;
    const host=im.parentElement; if(!host.style.backgroundImage){ host.classList.add('lq-host'); host.style.backgroundImage=`url(${lq})`; }
    if(!im.complete){ im.classList.add('lq'); im.addEventListener('load',()=>{ im.classList.add('lq-in'); requestAnimationFrame(()=>im.classList.remove('lq')); },{once:true}); }
  });
  // 3. application sheet: every Apply / Join the waitlist button opens it in place
  board.insertAdjacentHTML('beforeend',`<div class="ap" aria-hidden="true"><div class="ap-scrim"></div><div class="ap-sheet" role="dialog" aria-modal="true" aria-label="Apply for membership"><button class="ap-x" aria-label="Close">×</button><iframe title="Saint Haven membership application"></iframe></div></div>`);
  const ap=board.querySelector('.ap'), frame=ap.querySelector('iframe'), x=ap.querySelector('.ap-x'); let from=null;
  const open=t=>{ from=t; if(!frame.src) frame.src=APPLY_URL; ap.classList.add('open'); ap.setAttribute('aria-hidden','false'); board.classList.add('sheet-open'); setTimeout(()=>x.focus({preventScroll:true}),60); };
  const close=()=>{ ap.classList.remove('open'); ap.setAttribute('aria-hidden','true'); board.classList.remove('sheet-open'); if(from) from.focus({preventScroll:true}); };
  if(board._apClick){ board.removeEventListener('click',board._apClick); board.removeEventListener('keydown',board._apKey); }
  board._apClick=e=>{ const b=e.target.closest('.sh-button'); if(b&&board.contains(b)){ e.preventDefault(); open(b); } };
  board._apKey=e=>{ if(e.key==='Escape'&&ap.classList.contains('open')) close(); };
  board.addEventListener('click',board._apClick); board.addEventListener('keydown',board._apKey); board.classList.remove('sheet-open');
  ap.querySelector('.ap-scrim').addEventListener('click',close); x.addEventListener('click',close);
  // 5. no lone last words: tie the final two words of headings, quotes and body copy together
  page.querySelectorAll('.sec-h,.scene-h,.scene-p,.sec-body p,.conc-copy p,.bq,.hp-q,.sh-sub,.sh-micro').forEach(el=>{
    const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT), nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
    for(let i=nodes.length-1;i>=0;i--){ const t=nodes[i].nodeValue; if(/\S\s+\S+\s*$/.test(t)){ nodes[i].nodeValue=t.replace(/\s+(\S+\s*)$/,' $1'); break; } }
  });
}
function fit(){ document.querySelectorAll('.frame').forEach(f=>{const a=f.querySelector('.artboard'); const s=f.clientWidth/a.offsetWidth; a.style.transform=`scale(${s})`; f.style.height=(a.offsetHeight*s)+'px';}); }
addEventListener('resize',fit); fit(); document.fonts&&document.fonts.ready.then(fit);
const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting&&!e.target.dataset.seen){e.target.dataset.seen=1; e.target._replay();} }),{threshold:.15});
document.querySelectorAll('.opt').forEach(s=>io.observe(s));
</script>
